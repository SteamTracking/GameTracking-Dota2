	optional .EEvent event_id = 1 [default = EVENT_ID_NONE];
	optional bool remove_audit = 2;
}

message CMsgClientToGCDevResetEventStateResponse {
	enum EResponse {
		k_eInternalError = 0;
		k_eSuccess = 1;
		k_eTooBusy = 2;
		k_eDisabled = 3;
		k_eTimeout = 4;
		k_eNotAllowed = 5;
