	optional uint32 action_id = 2;
	optional uint32 action_score = 3;
}

message CMsgClientToGCDevGrantEventActionResponse {
	enum EResponse {
		k_eInternalError = 0;
		k_eSuccess = 1;
		k_eTooBusy = 2;
		k_eDisabled = 3;
