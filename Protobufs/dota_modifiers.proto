import "networkbasetypes.proto";
import "google/protobuf/descriptor.proto";

option additional_includes = "dota_constants.h";
option additional_includes = "entity2/gametime.h";
option additional_includes = "entityhandle.h";

enum DOTA_MODIFIER_ENTRY_TYPE {
	DOTA_MODIFIER_ENTRY_TYPE_ACTIVE = 1;
	DOTA_MODIFIER_ENTRY_TYPE_REMOVED = 2;
}

message CDOTAModifierBuffTableEntry {
	optional .DOTA_MODIFIER_ENTRY_TYPE entry_type = 1 [default = DOTA_MODIFIER_ENTRY_TYPE_ACTIVE];
	optional uint32 parent = 2 [default = 16777215, boxed_type = "CEHandleNetworkableInt", synthetic_default = "16777215"];
	optional int32 index = 3;
	optional int32 serial_num = 4;
	optional int32 modifier_class = 5;
	optional int32 ability_level = 6;
	optional int32 stack_count = 7;
	optional float creation_time = 8 [boxed_type = "GameTime_t"];
	optional float duration = 9 [default = -1];
	optional uint32 caster = 10 [default = 16777215, boxed_type = "CEHandleNetworkableInt", synthetic_default = "16777215"];
	optional uint32 ability = 11 [default = 16777215, boxed_type = "CEHandleNetworkableInt", synthetic_default = "16777215"];
	optional int32 armor = 12;
	optional float fade_time = 13;
	optional bool subtle = 14;
	optional float channel_time = 15;
	optional .CMsgVector v_start = 16;
	optional .CMsgVector v_end = 17;
	optional string portal_loop_appear = 18;
	optional string portal_loop_disappear = 19;
	optional string hero_loop_appear = 20;
	optional string hero_loop_disappear = 21;
	optional int32 movement_speed = 22;
	optional bool aura = 23;
	optional int32 activity = 24;
	optional int32 damage = 25;
	optional int32 range = 26;
	optional int32 dd_modifier_index = 27;
	optional int32 dd_ability_id = 28 [default = -1, boxed_type = "AbilityID_t", synthetic_default = "-1"];
	optional string illusion_label = 29;
	optional bool active = 30;
	optional string player_ids = 31;
	optional string lua_name = 32;
	optional int32 attack_speed = 33;
	optional uint32 aura_owner = 34 [default = 16777215, boxed_type = "CEHandleNetworkableInt", synthetic_default = "16777215"];
	optional int32 bonus_all_stats = 35;
	optional int32 bonus_health = 36;
	optional int32 bonus_mana = 37;
	optional uint32 custom_entity = 38 [default = 16777215, boxed_type = "CEHandleNetworkableInt", synthetic_default = "16777215"];
	optional bool aura_within_range = 39;
	optional float move_slow = 40;
	optional bool has_scepter = 41;
	optional bool has_shard = 42;
	repeated int32 custom_int_values = 43;
	repeated float custom_float_values = 44;
}

message CDOTALuaModifierEntry {
	optional int32 modifier_type = 1;
	optional string modifier_filename = 2;
}
