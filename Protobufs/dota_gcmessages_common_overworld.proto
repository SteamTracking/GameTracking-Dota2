	k_eOverworldAuditAction_EncounterRewardTokenCost = 13;
	k_eOverworldAuditAction_EncounterRewardTokenReward = 14;
	k_eOverworldAuditAction_SupportGrantTokens = 16;
	k_eOverworldAuditAction_TokenGiftSent = 17;
