enum EOverworldMinigameAction {
	k_eOverworldMinigameAction_Invalid = 0;
	k_eOverworldMinigameAction_DevReset = 1;
	k_eOverworldMinigameAction_DevGiveCurrency = 2;
	k_eOverworldMinigameAction_Purchase = 3;
